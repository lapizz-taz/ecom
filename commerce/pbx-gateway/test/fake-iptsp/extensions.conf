[general]
static = yes

[from-gateway]
; A customer who answers and talks for 4 seconds.
exten => 01711000111,1,Answer()
 same => n,Set(TIMEOUT(absolute)=4)
 same => n,Echo()
; A busy customer.
exten => 01811000222,1,Busy(3)
exten => _X.,1,Answer()
 same => n,Wait(3)
 same => n,Hangup()

[out]
; "channel originate Local/call@out extension s@hold" places a customer call to the business number.
exten => call,1,Set(CALLERID(num)=01722000444)
 same => n,Dial(PJSIP/09639123456@gateway,30)
 same => n,Hangup()

[hold]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(absolute)=6)
 same => n,Echo()
