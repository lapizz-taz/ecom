; A stand-in for the IPTSP (tests only): accepts the gateway's registration
; as acct1/trunkpass, answers calls, and can call the business number.
[global]
type = global
endpoint_identifier_order = username,ip

[t-udp]
type = transport
protocol = udp
bind = 127.0.0.2:5070

[acct1]
type = endpoint
transport = t-udp
context = from-gateway
disallow = all
allow = alaw,ulaw
auth = acct1
aors = acct1
direct_media = no
rtp_symmetric = yes

[acct1]
type = auth
auth_type = digest
username = acct1
password = trunkpass

[acct1]
type = aor
max_contacts = 1
remove_existing = yes

[gateway]
type = endpoint
transport = t-udp
context = from-gateway
disallow = all
allow = alaw,ulaw
aors = gateway
direct_media = no

[gateway]
type = aor
contact = sip:127.0.0.1:5060
