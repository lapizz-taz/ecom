; HTTP (plain) serves ARI and must stay on 127.0.0.1. Browsers use the TLS port
; (8089, wss://<host>:8089/ws), which also carries the SIP WebSocket.
[general]
enabled = yes
bindaddr = ${HTTP_BIND}
bindport = ${HTTP_PORT}
tlsenable = ${TLS_ENABLE}
tlsbindaddr = 0.0.0.0:${HTTPS_PORT}
tlscertfile = ${TLS_CERT}
tlsprivatekey = ${TLS_KEY}
servername = VoiceDrive
