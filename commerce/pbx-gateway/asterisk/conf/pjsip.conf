[global]
type = global
user_agent = VoiceDrive PBX
default_realm = voicedrive
endpoint_identifier_order = username,ip,anonymous

; WebRTC softphones (wss://<host>:${HTTPS_PORT}/ws). The browser's SIP.js connects here.
[transport-wss]
type = transport
protocol = ${WS_PROTOCOL}
bind = 0.0.0.0

; IPTSP trunks.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:${SIP_PORT}
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}
local_net = ${LOCAL_NET}

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:${SIP_PORT}
external_media_address = ${EXTERNAL_IP}
external_signaling_address = ${EXTERNAL_IP}
local_net = ${LOCAL_NET}

; One block per business trunk, written by the VoiceDrive controller.
#include vd/trunks.conf
