; All call logic lives in the VoiceDrive controller (ARI app "voicedrive").
[general]
static = yes
writeprotect = yes

[vd-agents]
; A softphone dialled a number. The controller checks the request with the app.
exten => _X.,1,Stasis(voicedrive,outbound,${EXTEN})
 same => n,Hangup()
exten => _+X.,1,Stasis(voicedrive,outbound,${EXTEN})
 same => n,Hangup()

[vd-trunk-in]
; A call reached a business number. VD_BUSINESS comes from the trunk endpoint.
exten => _X.,1,Stasis(voicedrive,inbound,${EXTEN},${VD_BUSINESS})
 same => n,Hangup()
exten => _+X.,1,Stasis(voicedrive,inbound,${EXTEN},${VD_BUSINESS})
 same => n,Hangup()
exten => s,1,Stasis(voicedrive,inbound,${CUT(CUT(PJSIP_HEADER(read,To),@,1),:,2)},${VD_BUSINESS})
 same => n,Hangup()

[vd-internal]
exten => _X.,1,Hangup(21)
